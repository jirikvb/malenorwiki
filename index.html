<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MalenorWiki</title>
<meta name="description" content="Společná kronika světa Malenor.">
<meta name="theme-color" content="#e9e4d3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141f" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css?v=9">
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
<script type="module" src="app.js?v=9"></script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/">MalenorWiki</a>
    <form class="search" id="searchForm" role="search" hidden>
      <label class="sr" for="searchInput">Hledat ve wiki</label>
      <input type="search" id="searchInput" placeholder="Hledat…" autocomplete="off">
    </form>
    <div class="who" id="who"></div>
  </div>
  <nav class="nav" id="nav" aria-label="Sekce" hidden></nav>
  <div class="band" id="band" hidden></div>
</header>
<button type="button" class="rail" id="rail" hidden aria-label="Otevřít historickou osu" aria-controls="drawer" aria-expanded="false"></button>
<aside class="drawer" id="drawer" hidden aria-label="Historická osa">
  <div class="drawer-head"><h2>Historická osa</h2><a class="btn" href="#/osa">Celá stránka</a><button type="button" class="ghost" id="drawerClose">Zavřít</button></div>
  <div id="drawerBody"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>
<main id="view" class="view" tabindex="-1">
  <p class="muted">Načítám…</p>
</main>
<footer class="foot">
  <span>MalenorWiki</span>
  <a href="#/kalendar">Kalendář a Časinka</a>
  <a href="https://github.com/jirikvb/malenorwiki" target="_blank" rel="noopener">Kód na GitHubu</a>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
